<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM X-Ray Clean Fixture</title>
  <link rel="stylesheet" href="/assets/clean.css">
  <link rel="preload" href="/assets/clean.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="/assets/clean.js"></script>
</head>
<body data-xray-id="n-root">
  <header data-xray-id="n-header">Clean fixture</header>
  <main data-xray-id="n-main">
    <article data-xray-id="n-card">
      <h1>One stable page.</h1>
      <img src="/media/clean.svg" alt="Deterministic block">
    </article>
    <div id="secret-123456789012345678901234" class="probe-include abcdefghijklmnopqrstuvwxyzabcdef" data-xray-id="include-plain">Unmarked-rule control</div>
    <img class="probe-duplicate-image" data-xray-id="include-duplicate-image" src="/media/clean.svg" alt="The same resource used twice">
    <div class="probe-display-none" data-xray-id="exclude-display">Display none</div>
    <div class="probe-hidden" data-xray-id="exclude-hidden">Hidden</div>
    <div class="probe-transparent" data-xray-id="exclude-opacity">Transparent</div>
    <div class="probe-tiny" data-xray-id="exclude-tiny">Tiny</div>
    <div class="probe-offscreen" data-xray-id="exclude-offscreen">Offscreen</div>
    <div class="probe-partial" data-xray-id="include-partial">Partially clipped</div>
  </main>
  <footer data-xray-id="n-footer">No motion. No interaction.</footer>
</body>
</html>
