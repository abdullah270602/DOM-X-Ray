name: Publish interactive preview

on:
  push:
    branches: [codex/gate-3-lease-recovery]
    paths:
      - 'viewer/**'
      - 'fixtures/**'
      - 'shared/**'
      - 'docs/**'
      - '.github/workflows/public-preview.yml'

permissions:
  contents: read

concurrency:
  group: public-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: npm run build -- --base=/DOM-X-Ray/ --outDir dist-preview
        working-directory: viewer
        env:
          VITE_PUBLIC_DEMO: 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: viewer/dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
